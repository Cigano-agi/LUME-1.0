name: Preparar Lume beta assinado

on:
  push:
    tags:
      - "v3.*"

permissions:
  contents: read

concurrency:
  group: lume-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    environment: windows-signing
    env:
      LUME_RELEASE_APPROVED: PUBLICAR
      WINDOWS_CERTIFICATE_P12_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Conferir portões da release Windows
        run: node scripts/release-readiness.mjs --mode windows
      - name: Preparar certificado sem exibir o segredo
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_P12_BASE64 -or -not $env:CSC_KEY_PASSWORD) { throw 'Credenciais Windows ausentes.' }
          $cert = Join-Path $env:RUNNER_TEMP 'windows-signing.p12'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_P12_BASE64))
          "CSC_LINK=$cert" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: npm run release:prepare
      - name: Obter e verificar os mesmos pesos Laya da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/laya-release-assets.mjs prepare
      - name: Assinar auxiliares antes de fechar políticas e pacote
        run: node scripts/prepare-windows-signed-build.mjs
      - name: Construir com assinatura isolada, sem senha na linha de comando
        shell: pwsh
        run: |
          $env:LUME_WINDOWS_SIGN_PASSWORD = $env:CSC_KEY_PASSWORD
          Remove-Item Env:CSC_KEY_PASSWORD
          Remove-Item Env:CSC_LINK
          npm run desktop:build -- --config work/windows-signed-electron-builder.json
      - name: Validar assinatura Authenticode
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/desktop -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Instalador Windows ausente.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup.FullName
          if ($signature.Status -ne 'Valid' -or
              $signature.SignerCertificate.Thumbprint -ne $env:LUME_WINDOWS_SIGNER_THUMBPRINT) {
            throw 'Assinatura do instalador não corresponde ao certificado da release.'
          }
          $updateConfig = Get-Content -Raw 'dist/desktop/win-unpacked/resources/app-update.yml'
          if ($updateConfig -notmatch '(?m)^publisherName:\s*.+$') { throw 'Identidade do publicador ausente da política do atualizador.' }
      - name: Validar todos os binários nativos Windows
        run: node scripts/verify-windows-signatures.mjs dist/desktop/win-unpacked
      - name: Conferir política e bytes assinados dentro do pacote
        run: node scripts/verify-windows-signed-package.mjs dist/desktop/win-unpacked
      - name: Auditar pacote nativo Windows
        env:
          ASSESSOR_PACKAGE_PLATFORM: win32
          ASSESSOR_PACKAGE_ARCH: x64
        run: node test/desktop-package.mjs
      - name: Conferir Laya dentro do aplicativo Windows
        run: node scripts/laya-release-assets.mjs verify windows
      - name: Exercitar aplicativo empacotado Windows
        env:
          ASSESSOR_TEST_EXECUTABLE: dist/desktop/win-unpacked/Lume.exe
        run: npm run test:desktop
      - name: Registrar prova nativa Windows
        env:
          LUME_NATIVE_VERIFICATION: VERIFICADO
        run: node scripts/release-readiness.mjs --platform windows --architecture x64 --artifacts dist/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/desktop/*yml
            dist/desktop/release-proof-windows.json
          if-no-files-found: error
          retention-days: 7

  macos-build:
    name: Assinar universal e provar arm64
    runs-on: macos-15
    timeout-minutes: 75
    environment: macos-signing
    env:
      TMPDIR: /private/tmp
      LUME_RELEASE_APPROVED: PUBLICAR
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.MAC_NOTARIZATION_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.MAC_NOTARIZATION_ISSUER_ID }}
      MAC_NOTARIZATION_API_KEY_BASE64: ${{ secrets.MAC_NOTARIZATION_API_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Preparar credenciais sem exibir valores
        shell: bash
        run: |
          set -euo pipefail
          for value in "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$MAC_NOTARIZATION_API_KEY_BASE64"; do
            if [[ -z "$value" ]]; then echo "Credenciais macOS ausentes." >&2; exit 1; fi
          done
          key="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$MAC_NOTARIZATION_API_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Conferir portões da release macOS
        run: node scripts/release-readiness.mjs --mode macos
      - run: npm run release:prepare
      - name: Obter e verificar os mesmos pesos Laya da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/laya-release-assets.mjs prepare
      - run: npm run desktop:mac:check -- --universal
      - name: Preparar dependências nativas das duas arquiteturas
        run: npm run desktop:deps:mac:universal
      - run: npm run desktop:build:mac -- --universal
      - name: Validar universal, assinatura, Gatekeeper e notarização no arm64
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          app="dist/desktop/mac-universal/Lume.app"
          arches=" $(lipo -archs "$app/Contents/MacOS/Lume") "
          [[ "$arches" == *" arm64 "* ]]
          [[ "$arches" == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
      - name: Auditar pacote universal macOS
        env:
          ASSESSOR_PACKAGE_PLATFORM: darwin
          ASSESSOR_PACKAGE_ARCH: universal
        run: node test/desktop-package.mjs
      - name: Conferir Laya dentro do aplicativo universal
        run: node scripts/laya-release-assets.mjs verify macos
      - name: Exercitar fatia arm64 do aplicativo universal
        env:
          ASSESSOR_TEST_EXECUTABLE: dist/desktop/mac-universal/Lume.app/Contents/MacOS/Lume
        run: |
          node test/macos-universal-native.mjs --app dist/desktop/mac-universal/Lume.app --architecture arm64
          npm run test:desktop
      - name: Registrar prova nativa arm64
        env:
          LUME_NATIVE_VERIFICATION: VERIFICADO
        run: node scripts/release-readiness.mjs --platform macos --architecture arm64 --artifacts dist/desktop
      - name: Transferir o mesmo candidato para o runner Intel
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal-candidate
          path: |
            dist/desktop/*-mac-universal.dmg
            dist/desktop/*-mac-universal.zip
            dist/desktop/*-mac-universal.zip.blockmap
            dist/desktop/beta-mac.yml
            dist/desktop/release-proof-macos-arm64.json
          if-no-files-found: error
          retention-days: 1

  macos-intel:
    name: Provar x64 e fechar release universal
    needs: macos-build
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      TMPDIR: /private/tmp
      LUME_RELEASE_APPROVED: PUBLICAR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: release-macos-universal-candidate
          path: dist/desktop
      - name: Validar e executar a fatia x64 do mesmo DMG
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "x86_64"
          node -e "if(process.platform!=='darwin'||process.arch!=='x64')process.exit(1)"
          dmg="$(find dist/desktop -maxdepth 1 -name 'Lume-*-mac-universal.dmg' -print -quit)"
          test -n "$dmg"
          mount="$RUNNER_TEMP/lume-release"
          mkdir -p "$mount"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          ditto "$mount/Lume.app" "$RUNNER_TEMP/Lume.app"
          hdiutil detach "$mount"
          trap - EXIT
          app="$RUNNER_TEMP/Lume.app"
          node scripts/laya-release-assets.mjs verify macos "$app/Contents/Resources/laya"
          arches=" $(lipo -archs "$app/Contents/MacOS/Lume") "
          [[ "$arches" == *" arm64 "* ]]
          [[ "$arches" == *" x86_64 "* ]]
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          node test/macos-universal-native.mjs --app "$app" --architecture x64
          ASSESSOR_TEST_EXECUTABLE="$app/Contents/MacOS/Lume" npm run test:desktop
      - name: Registrar prova x64 e combinar as duas arquiteturas
        env:
          LUME_NATIVE_VERIFICATION: VERIFICADO
          LUME_PUBLIC_SIGNATURE_VERIFICATION: VERIFICADO
        run: |
          node scripts/release-readiness.mjs --platform macos --architecture x64 --public-verification --artifacts dist/desktop
          node scripts/release-readiness.mjs --merge-macos --artifacts dist/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: |
            dist/desktop/*-mac-universal.dmg
            dist/desktop/*-mac-universal.zip
            dist/desktop/*-mac-universal.zip.blockmap
            dist/desktop/beta-mac.yml
            dist/desktop/release-proof-macos.json
          if-no-files-found: error
          retention-days: 7
